spring:
  application:
    name: backend
  cloud:
    gcp:
      project-id: mindful-rhythm-426908-a5

app:
  jwt:
    secret: ${JWT_SECRET}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  cors:
    allowed-origin-patterns:
      - "http://localhost:*"              # Local development (any port)
      - "exp://*"                         # Expo Go (any host/port)
      - "http://192.168.*.*:*"            # Local network IPs (any port)
      - "http://10.*.*.*:*"               # Private network range (any port)
      - "https://lazyspender.zirchel.com" # AWS CloudFront prod (see docs/aws-static-hosting-adr.md)
  expense-categories:
    - Allowance
    - Car Loan
    - Car Maintenance
    - Food & Drinks
    - Fuel
    - Groceries
    - Health & Medical
    - Holidays & Events
    - Housing
    - Incident/Emergencies
    - Life & Entertainment
    - Others
    - Parking
    - Pets, animals
    - Ride-Hailing
    - Shopping
    - Sports & Fitness
    - Technology & Communication
    - Toll

migration:
  backfill-transportation-category-split:
    enabled: true
